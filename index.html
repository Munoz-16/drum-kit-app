<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drum Kit</title>

    <!-- Connect the CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main container for the drum kit -->
    <main class="drum-container">

        <h1>DRUM KIT</h1>

        <!-- Kick drum button -->
        <button id="kick-button" class="drum-button">
            KICK
        </button>

        <!-- Ride cymbal button -->
        <button id="ride-button" class="drum-button">
            RIDE
        </button>

        <!-- Keyboard instructions -->
        <p>A = Kick | S = Ride</p>

    </main>

    <!-- Pre-load the Kick audio file -->
    <audio id="kick-sound" preload="auto">
        <source src="sounds/kick.wav" type="audio/wav">
    </audio>

    <!-- Pre-load the Ride audio file -->
    <audio id="ride-sound" preload="auto">
        <source src="sounds/ride.wav" type="audio/wav">
    </audio>

    <!-- Connect the JavaScript file -->
    <script src="action.js"></script>

</body>

</html>
